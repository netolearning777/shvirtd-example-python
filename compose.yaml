include:
  - proxy.yaml

# The parser will ignore extension fields prefixed with x-
x-deploy: &deploy-dev
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 512M
      reservations:
        memory: 256M
x-env_file: &env_file
  env_file:
    - .env
x-restart: &restart
  restart: always #no, on-failure , always(default), unless-stopped

services:
  web:
    <<: [*deploy-dev, *restart]
    build:
      context: .
      dockerfile: Dockerfile_multistage.python
    environment:
      DB_HOST: 172.20.0.10
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    networks:
      backend:
        ipv4_address: 172.20.0.5
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: [*deploy-dev, *env_file, *restart]
    image: mysql:8
    networks:
      backend:
        ipv4_address: 172.20.0.10
    #volumes:
    #  - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
